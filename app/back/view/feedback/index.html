{extend name="common/layout" /}
{block name="content"}
<body>
<div class="container-fluid p-t-15" style="height: calc(100vh - 60px);">
	<div class="row m-0" style="height: 100%;">
		<!-- 左侧会话列表 -->
		<div class="col-lg-3 col-md-4 p-0 border-right" style="height: 100%; display: flex; flex-direction: column;">
			<div class="card m-0" style="flex: 1; display: flex; flex-direction: column; border-radius: 0;">
				<div class="card-header bg-white border-bottom">
					<div class="d-flex align-items-center" style="gap: 10px;">
						<div class="search-box" style="flex: 1;">
							<input type="text" class="form-control search-input" id="searchInput" placeholder="搜索用户..." style="border-radius: 7px; height: 36px;">
							<button class="btn-clear-search" type="button" onclick="clearSearch()" style="display: none;">
								<i class="mdi mdi-close-circle"></i>
							</button>
						</div>
						<div class="custom-control custom-checkbox">
							<input type="checkbox" class="custom-control-input" id="showHiddenCheck" onchange="toggleShowHidden()">
							<label class="custom-control-label" for="showHiddenCheck" style="font-size: 13px; white-space: nowrap;">显示隐藏</label>
						</div>
					</div>
				</div>
				<div class="card-body p-0" style="flex: 1; overflow-y: auto;" id="sessionList">
					<div class="text-center p-4">
						<i class="mdi mdi-loading mdi-spin fs-24"></i>
						<p class="text-muted m-t-10">加载中...</p>
					</div>
				</div>
			</div>
		</div>
		
		<!-- 右侧聊天区域 -->
		<div class="col-lg-9 col-md-8 p-0" style="height: 100%; position: relative;">
			<div id="emptyState" style="height: 100%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; position: absolute; inset: 0; opacity: 1; transition: opacity 0.25s ease; z-index: 1;">
				<div class="text-center">
					<i class="mdi mdi-message-text-outline" style="font-size: 80px; color: #ccc;"></i>
					<p class="text-muted m-t-10">选择一个会话开始聊天</p>
				</div>
			</div>
			
			<div id="chatArea" style="height: 100%; flex-direction: column; display: flex; position: absolute; inset: 0; opacity: 0; transition: opacity 0.25s ease; visibility: hidden; z-index: 0;">
				<!-- 聊天头部 -->
				<div class="chat-header bg-white border-bottom p-3 d-flex align-items-center justify-content-between">
					<div class="d-flex align-items-center">
						<a href="javascript:void(0);" id="chatHeaderUserId" onclick="showUserInfo()" class="text-primary font-weight-bold" style="font-size: 14px; text-decoration: none; min-width: 80px; display: inline-block; pointer-events: auto; cursor: pointer;"></a>
					</div>
					<div>
						<button class="btn btn-sm btn-outline-secondary" onclick="toggleSessionHidden()" id="btnToggleHidden">
							<i class="mdi mdi-eye-off"></i> 隐藏会话
						</button>
					</div>
				</div>
				
				<!-- 消息列表 -->
				<div class="chat-messages p-3" id="messageList" style="flex: 1; overflow-y: auto; background: #f5f5f5;">
					<div class="text-center p-4">
						<i class="mdi mdi-loading mdi-spin fs-24"></i>
						<p class="text-muted m-t-10">加载中...</p>
					</div>
				</div>
				
				<!-- 输入框 -->
				<div class="chat-input bg-white border-top p-3">
					<div class="d-flex align-items-end" style="gap: 10px;">
						<textarea class="form-control" id="messageInput" rows="3" placeholder="输入回复内容..." style="resize: none; border-radius: 7px;"></textarea>
						<button class="btn btn-primary" onclick="sendMessage()" style="height: 38px; white-space: nowrap;">
							<i class="mdi mdi-send"></i> 发送
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- 用户信息模态框 -->
<div class="modal fade" id="userInfoModal" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">
					<i class="mdi mdi-account-circle"></i> 用户信息
				</h5>
				<button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
			</div>
			<div class="modal-body">
				<div id="userInfoLoading" class="text-center p-4">
					<i class="mdi mdi-loading mdi-spin fs-24"></i>
					<p class="text-muted m-t-10">加载中...</p>
				</div>
				
				<div id="userInfoContent" style="display: none;">
					<!-- 用户基本信息 -->
					<div class="card m-b-15">
						<div class="card-body">
							<h6 class="card-title m-b-15">基本信息</h6>
							<div class="user-info-grid">
								<div class="user-info-item">
									<span class="user-info-label">用户 ID</span>
									<span id="userInfoId"></span>
								</div>
								<div class="user-info-item">
									<span class="user-info-label">注册时间</span>
									<span id="userInfoCreateTime"></span>
								</div>
								<div class="user-info-item">
									<span class="user-info-label">上次登录</span>
									<span id="userInfoLoginTime"></span>
								</div>
								<div class="user-info-item">
									<span class="user-info-label">上次登录IP</span>
									<span id="userInfoUuid"></span>
								</div>
								<div class="user-info-item">
									<span class="user-info-label">普通会员</span>
									<span id="userInfoExpire"></span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<style>
body {
	overflow: hidden;
}

/* 搜索框样式 */
.search-box {
	position: relative;
}

.search-input {
	padding-right: 35px;
}

.btn-clear-search {
	position: absolute;
	right: 8px;
	top: 50%;
	transform: translateY(-50%);
	border: none;
	background: transparent;
	color: #6c757d;
	cursor: pointer;
	padding: 0;
	width: 24px;
	height: 24px;
	display: flex;
	align-items: center;
	justify-content: center;
	border-radius: 50%;
	transition: all 0.2s;
}

.btn-clear-search:hover {
	background-color: rgba(0,0,0,0.05);
	color: #dc3545;
}

.btn-clear-search i {
	font-size: 18px;
}

/* 会话列表 */
.session-item {
	padding: 12px 15px;
	border-bottom: 1px solid #f0f0f0;
	cursor: pointer;
	transition: background 0.2s;
	position: relative;
}

.session-item:hover {
	background: #f8f9fa;
}

.session-item.active {
	background: #e3f2fd;
}

.session-item.hidden {
	opacity: 0.5;
}

.session-user {
	font-weight: 500;
	color: #333;
	margin-bottom: 5px;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

.session-time {
	color: #999;
	font-size: 12px;
}

.session-replied,
.session-unreplied {
	display: inline-block;
	padding: 2px 8px;
	border-radius: 10px;
	font-size: 11px;
	white-space: nowrap;
}

.session-replied {
	background: #e8f5e9;
	color: #4caf50;
}

.session-unreplied {
	background: #fff3e0;
	color: #ff9800;
}

.session-unread {
	position: absolute;
	top: 12px;
	right: 15px;
	background: #f44336;
	color: white;
	border-radius: 10px;
	padding: 2px 8px;
	font-size: 11px;
	min-width: 20px;
	text-align: center;
}

/* 消息样式 */
.message-item {
	margin-bottom: 20px;
	display: flex;
	align-items: flex-start;
}

.message-item.user {
	justify-content: flex-start;
}

.message-item.admin {
	justify-content: flex-end;
}

.message-avatar {
	width: 40px;
	height: 40px;
	border-radius: 50%;
	background: #007bff;
	color: white;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 20px;
	flex-shrink: 0;
}

.message-item.admin .message-avatar {
	background: #28a745;
}

.message-content {
	max-width: 60%;
	margin: 0 10px;
}

.message-bubble {
	padding: 10px 15px;
	border-radius: 10px;
	word-wrap: break-word;
	white-space: pre-wrap;
}

.message-item.user .message-bubble {
	background: white;
	border: 1px solid #e0e0e0;
}

.message-item.admin .message-bubble {
	background: #007bff;
	color: white;
}

.message-time {
	font-size: 11px;
	color: #999;
	margin-top: 5px;
}

.message-item.user .message-time {
	text-align: left;
}

.message-item.admin .message-time {
	text-align: right;
}

/* 用户信息对齐布局 */
.user-info-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 10px 24px;
}

.user-info-item {
	display: flex;
	align-items: baseline;
	gap: 0;
	font-size: 14px;
}

.user-info-label {
	flex-shrink: 0;
	width: 90px;
	color: #6c757d;
	font-weight: 500;
}

.user-info-label::after {
	content: '：';
}

/* 聊天头部用户ID */
#chatHeaderUserId {
	transition: opacity 0.15s ease;
}
#chatHeaderUserId:hover {
	opacity: 0.7;
	text-decoration: underline !important;
}

/* 移动端适配 */
@media (max-width: 768px) {
	.col-md-4 {
		display: none;
	}
	
	.col-md-4.show-mobile {
		display: block !important;
		position: fixed;
		left: 0;
		top: 60px;
		width: 100%;
		height: calc(100vh - 60px);
		z-index: 1000;
		background: white;
	}
	
	.col-md-8 {
		width: 100%;
	}
	
	.message-content {
		max-width: 80%;
	}
}
</style>

<script type="text/javascript">
var currentSessionId = null;
var currentSessionData = null;
var showHidden = 0;
var searchKeyword = '';

$(function() {
	loadSessions();
	
	// 搜索框输入事件
	$('#searchInput').on('input', function() {
		var val = $(this).val().trim();
		if (val) {
			$('.btn-clear-search').show();
		} else {
			$('.btn-clear-search').hide();
		}
		
		clearTimeout(window.searchTimer);
		window.searchTimer = setTimeout(function() {
			searchKeyword = val;
			loadSessions();
		}, 500);
	});
	
	// 消息输入框快捷键
	$('#messageInput').on('keydown', function(e) {
		// 回车发送，Shift+回车换行
		if (e.keyCode == 13 && !e.shiftKey) {
			e.preventDefault(); // 阻止默认换行
			sendMessage();
		}
	});
});

// 加载会话列表
function loadSessions() {
	$.ajax({
		url: "{:url('feedback/getSessions')}",
		type: 'GET',
		data: {
			search: searchKeyword,
			show_hidden: showHidden
		},
		dataType: 'json',
		success: function(res) {
			if (res.error_code == 2000) {
				renderSessions(res.data.sessions);
			} else {
				showMsg(res.msg || '加载失败', 'danger');
			}
		},
		error: function() {
			$('#sessionList').html('<div class="text-center p-4"><p class="text-danger">加载失败</p></div>');
		}
	});
}

// 渲染会话列表
function renderSessions(sessions) {
	if (sessions.length == 0) {
		var emptyHtml = '<div class="text-center p-4">';
		emptyHtml += '<i class="mdi mdi-inbox fs-48 text-muted"></i>';
		emptyHtml += '<p class="text-muted m-t-10">' + (searchKeyword ? '未找到相关会话' : '暂无会话') + '</p>';
		emptyHtml += '</div>';
		$('#sessionList').html(emptyHtml);
		return;
	}
	
	var html = '';
	sessions.forEach(function(session) {
		var activeClass = currentSessionId == session.id ? 'active' : '';
		var hiddenClass = session.is_hidden == 1 ? 'hidden' : '';
		var unreadHtml = session.unread_count > 0 ? '<span class="session-unread">' + session.unread_count + '</span>' : '';
		
		// 确保时间戳是有效的数值
		var timestamp = parseInt(session.last_message_time) || 0;
		
		// 回复状态标识
		var replyStatus = '';
		if (session.is_replied == 1) {
			replyStatus = '<span class="session-replied">已回复</span>';
		} else {
			replyStatus = '<span class="session-unreplied">未回复</span>';
		}
		
		html += '<div class="session-item ' + activeClass + ' ' + hiddenClass + '" onclick="selectSession(' + session.id + ')">';
		html += '<div class="session-user">';
		html += '<span>' + (session.user_id || '未知') + '</span>';
		html += unreadHtml;
		html += '</div>';
		html += '<div class="d-flex align-items-center justify-content-between">';
		html += '<div class="session-time">' + formatTime(timestamp) + '</div>';
		html += replyStatus;
		html += '</div>';
		html += '</div>';
	});
	
	$('#sessionList').html(html);
}

// 选择会话
function selectSession(sessionId) {
	currentSessionId = sessionId;
	$('.session-item').removeClass('active');
	$('.session-item').each(function() {
		if ($(this).attr('onclick').indexOf(sessionId) > -1) {
			$(this).addClass('active');
		}
	});
	
	loadMessages(sessionId);
}

// 加载消息列表
function loadMessages(sessionId) {
	// 淡入聊天区域，淡出空状态
	$('#emptyState').css({ opacity: 0, visibility: 'hidden', 'z-index': 0 });
	$('#chatArea').css({ opacity: 1, visibility: 'visible', 'z-index': 1 });
	
	$('#messageList').html('<div class="text-center p-4"><i class="mdi mdi-loading mdi-spin fs-24"></i><p class="text-muted m-t-10">加载中...</p></div>');
	
	$.ajax({
		url: "{:url('feedback/getMessages')}",
		type: 'GET',
		data: { session_id: sessionId },
		dataType: 'json',
		success: function(res) {
			if (res.error_code == 2000) {
				currentSessionData = res.data.session;
				renderMessages(res.data.messages);
				updateChatHeader(res.data.session);
				
				// 刷新会话列表（更新未读数）
				loadSessions();
			} else {
				showMsg(res.msg || '加载失败', 'danger');
			}
		},
		error: function() {
			$('#messageList').html('<div class="text-center p-4"><p class="text-danger">加载失败</p></div>');
		}
	});
}

// 渲染消息列表
function renderMessages(messages) {
	if (messages.length == 0) {
		$('#messageList').html('<div class="text-center p-4"><p class="text-muted">暂无消息</p></div>');
		return;
	}
	
	var html = '';
	messages.forEach(function(msg) {
		var isUser = msg.sender_type == 0;
		var typeClass = isUser ? 'user' : 'admin';
		var icon = isUser ? 'mdi-account' : 'mdi-shield-account';
		html += '<div class="message-item ' + typeClass + '">';
		if (isUser) {
			html += '<div class="message-avatar"><i class="mdi ' + icon + '"></i></div>';
		}
		html += '<div class="message-content">';
		html += '<div class="message-bubble">' + escapeHtml(msg.content) + '</div>';
		html += '<div class="message-time">' + formatTime(msg.create_time) + '</div>';
		html += '</div>';
		if (!isUser) {
			html += '<div class="message-avatar"><i class="mdi ' + icon + '"></i></div>';
		}
		html += '</div>';
	});
	
	$('#messageList').html(html);
	
	// 滚动到底部
	setTimeout(function() {
		$('#messageList').scrollTop($('#messageList')[0].scrollHeight);
	}, 100);
}

// 更新聊天头部
function updateChatHeader(session) {
	var uid = session.user_id || session.userId || '';
	$('#chatHeaderUserId').text('用户 ID: ' + (uid || '未知'));
	
	if (session.is_hidden == 1) {
		$('#btnToggleHidden').html('<i class="mdi mdi-eye"></i> 显示会话');
	} else {
		$('#btnToggleHidden').html('<i class="mdi mdi-eye-off"></i> 隐藏会话');
	}
}

// 显示用户信息
function showUserInfo() {
	if (!currentSessionData) {
		showMsg('请先选择一个会话', 'warning');
		return;
	}

	var userId = currentSessionData.user_id || currentSessionData.userId;
	if (!userId) {
		showMsg('无法获取用户信息', 'danger');
		return;
	}
	
	// 先重置内容，显示 loading，再弹出
	$('#userInfoLoading').show();
	$('#userInfoContent').hide();
	$('#userInfoModal').modal('show');
	
	$.ajax({
		url: "{:url('user/get')}",
		type: 'GET',
		data: { user_id: userId },
		dataType: 'json',
		success: function(res) {
			if (res.error_code == 2000) {
				var user = res.data.user;

				$('#userInfoId').text(user.id);
				$('#userInfoUuid').text(user.last_login_ip || '-');
				$('#userInfoCreateTime').text(user.create_time > 0 ? formatFullTime(user.create_time) : '-');
				$('#userInfoLoginTime').text(user.login_time > 0 ? formatFullTime(user.login_time) : '-');
				$('#userInfoExpire').text(user.expire > 0 ? formatFullTime(user.expire) : '-');

				$('#userInfoLoading').fadeOut(150, function() {
					$('#userInfoContent').fadeIn(200);
				});
			} else {
				showMsg(res.msg || '加载失败', 'danger');
				$('#userInfoModal').modal('hide');
			}
		},
		error: function() {
			showMsg('加载失败', 'danger');
			$('#userInfoModal').modal('hide');
		}
	});
}

// 格式化完整时间
function formatFullTime(timestamp) {
	var date = new Date(timestamp * 1000);
	var Y = date.getFullYear();
	var M = (date.getMonth() + 1 < 10 ? '0' + (date.getMonth() + 1) : date.getMonth() + 1);
	var D = (date.getDate() < 10 ? '0' + date.getDate() : date.getDate());
	var h = (date.getHours() < 10 ? '0' + date.getHours() : date.getHours());
	var m = (date.getMinutes() < 10 ? '0' + date.getMinutes() : date.getMinutes());
	var s = (date.getSeconds() < 10 ? '0' + date.getSeconds() : date.getSeconds());
	return Y + '-' + M + '-' + D + ' ' + h + ':' + m + ':' + s;
}

// 发送消息
function sendMessage() {
	if (!currentSessionId) {
		showMsg('请先选择会话', 'warning');
		return;
	}
	
	var content = $('#messageInput').val().trim();
	if (!content) {
		showMsg('请输入消息内容', 'warning');
		return;
	}
	
	$.ajax({
		url: "{:url('feedback/sendMessage')}",
		type: 'POST',
		data: {
			session_id: currentSessionId,
			content: content
		},
		dataType: 'json',
		success: function(res) {
			if (res.error_code == 2000) {
				$('#messageInput').val('');
				loadMessages(currentSessionId);
				loadSessions();
			} else {
				showMsg(res.msg || '发送失败', 'danger');
			}
		},
		error: function() {
			showMsg('发送失败', 'danger');
		}
	});
}

// 切换会话隐藏状态
function toggleSessionHidden() {
	if (!currentSessionId) {
		return;
	}
	
	// 判断当前会话是否已隐藏
	var isCurrentlyHidden = currentSessionData && currentSessionData.is_hidden == 1;
	
	$.ajax({
		url: "{:url('feedback/toggleHidden')}",
		type: 'POST',
		data: { session_id: currentSessionId },
		dataType: 'json',
		success: function(res) {
			if (res.error_code == 2000) {
				showMsg('操作成功', 'success');
				
				// 如果当前是显示状态，点击后变为隐藏，则关闭对话框
				if (!isCurrentlyHidden) {
					// 淡出聊天区域，淡入空状态
					$('#chatArea').css({ opacity: 0, visibility: 'hidden', 'z-index': 0 });
					$('#emptyState').css({ opacity: 1, visibility: 'visible', 'z-index': 1 });
					
					// 清空当前会话ID
					currentSessionId = null;
					currentSessionData = null;
				} else {
					// 如果是从隐藏变为显示，则重新加载消息
					loadMessages(currentSessionId);
				}
				
				// 刷新会话列表
				loadSessions();
			} else {
				showMsg(res.msg || '操作失败', 'danger');
			}
		},
		error: function() {
			showMsg('操作失败', 'danger');
		}
	});
}

// 切换显示隐藏会话
function toggleShowHidden() {
	showHidden = $('#showHiddenCheck').is(':checked') ? 1 : 0;
	loadSessions();
}

// 清空搜索
function clearSearch() {
	$('#searchInput').val('');
	$('.btn-clear-search').hide();
	searchKeyword = '';
	loadSessions();
}

// 格式化时间
function formatTime(timestamp) {
	
	var date = new Date(timestamp * 1000);
	
	// 检查日期是否有效
	if (isNaN(date.getTime())) {
		return '-';
	}
	
	var now = new Date();
	var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
	var yesterday = new Date(today.getTime() - 86400000);
	
	var Y = date.getFullYear();
	var M = (date.getMonth() + 1 < 10 ? '0' + (date.getMonth() + 1) : date.getMonth() + 1);
	var D = (date.getDate() < 10 ? '0' + date.getDate() : date.getDate());
	var h = (date.getHours() < 10 ? '0' + date.getHours() : date.getHours());
	var m = (date.getMinutes() < 10 ? '0' + date.getMinutes() : date.getMinutes());
	
	if (date >= today) {
		return h + ':' + m;
	} else if (date >= yesterday) {
		return '昨天 ' + h + ':' + m;
	} else {
		return M + '-' + D + ' ' + h + ':' + m;
	}
}

// HTML转义
function escapeHtml(text) {
	var map = {
		'&': '&amp;',
		'<': '&lt;',
		'>': '&gt;',
		'"': '&quot;',
		"'": '&#039;'
	};
	return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}
